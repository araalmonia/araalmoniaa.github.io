<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

    :root {
      --void: #05070f;
      --panel: rgba(12, 18, 38, 0.62);
      --cyan: #3df2ff;
      --violet: #8b5cff;
      --text: #e6ecff;
      --muted: #94a0cc;
      --line: rgba(61, 242, 255, 0.22);
      --hero-img: url("images/web.jpg");
      --display: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
      --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: var(--body);
      line-height: 1.7;
      color: var(--text);
      background: var(--void);
      overflow: hidden;
      text-align: center;
    }

    /* ---------- Layered background (same as portfolio) ---------- */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -3;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(139, 92, 255, 0.28), transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(61, 242, 255, 0.18), transparent 50%),
        var(--hero-img) center / cover no-repeat,
        var(--void);
      animation: aurora 12s ease-in-out infinite alternate;
    }
    @keyframes aurora { to { filter: hue-rotate(25deg) brightness(1.15); } }

    body::after {
      content: '';
      position: fixed; inset: 0; z-index: -2;
      background-image:
        linear-gradient(rgba(61, 242, 255, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(61, 242, 255, 0.07) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
      animation: grid-drift 14s linear infinite;
    }
    @keyframes grid-drift { to { background-position: 56px 56px; } }

    #bg-canvas { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

    /* scanning line sweeping down the screen */
    .scan {
      position: fixed; left: 0; right: 0; top: 0; height: 2px; z-index: 1;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      box-shadow: 0 0 18px var(--cyan);
      opacity: 0.55;
      animation: scan 6s linear infinite;
      pointer-events: none;
    }
    @keyframes scan { from { top: -2px; } to { top: 100%; } }

    /* ---------- Content ---------- */
    .welcome-content {
      position: relative; z-index: 2;
      width: min(760px, 92%);
      padding: clamp(2rem, 5vw, 3.4rem) clamp(1.4rem, 5vw, 3rem);
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 0 70px rgba(139, 92, 255, 0.16), inset 0 0 40px rgba(61, 242, 255, 0.04);
      animation: panel-in 0.9s cubic-bezier(.2, .8, .2, 1) both;
    }
    @keyframes panel-in {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }

    /* glowing corner brackets */
    .welcome-content::before,
    .welcome-content::after {
      content: ''; position: absolute; width: 26px; height: 26px;
      border: 2px solid var(--cyan);
      filter: drop-shadow(0 0 6px var(--cyan));
      animation: corner-pulse 2.6s ease-in-out infinite;
    }
    .welcome-content::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
    .welcome-content::after  { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
    @keyframes corner-pulse { 50% { opacity: 0.35; } }

    /* staggered entrance for each child */
    .welcome-content > * { opacity: 0; animation: rise 0.7s ease forwards; }
    .welcome-content > :nth-child(1) { animation-delay: 0.35s; }
    .welcome-content > :nth-child(2) { animation-delay: 0.5s; }
    .welcome-content > :nth-child(3) { animation-delay: 0.65s; }
    .welcome-content > :nth-child(4) { animation-delay: 0.8s; }
    .welcome-content > :nth-child(5) { animation-delay: 0.95s; }
    .welcome-content > :nth-child(6) { animation-delay: 1.1s; }
    .welcome-content > :nth-child(7) { animation-delay: 1.25s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }

    /* emblem: spinning gradient ring */
    .emblem {
      width: 92px; aspect-ratio: 1; margin: 0 auto 1.4rem;
      display: grid; place-items: center;
      border-radius: 50%; border: 3px solid transparent;
      font-family: var(--display); font-weight: 700; font-size: 1.7rem; color: var(--text);
      background:
        linear-gradient(var(--void), var(--void)) padding-box,
        conic-gradient(from var(--angle), var(--cyan), var(--violet), var(--cyan)) border-box;
      box-shadow: 0 0 40px rgba(61, 242, 255, 0.3), 0 0 90px rgba(139, 92, 255, 0.22);
      animation: spin-ring 6s linear infinite, float 6s ease-in-out infinite, rise 0.7s ease 0.35s forwards;
    }
    @keyframes spin-ring { to { --angle: 360deg; } }
    @keyframes float { 50% { margin-top: -8px; margin-bottom: calc(1.4rem + 8px); } }

    .status {
      display: inline-flex; align-items: center; gap: 0.6rem;
      font-family: var(--display); font-size: 0.8rem; letter-spacing: 0.3em;
      color: var(--cyan); margin-bottom: 1rem;
    }
    .status::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: var(--cyan); box-shadow: 0 0 10px var(--cyan);
      animation: ping 1.6s ease-out infinite;
    }
    @keyframes ping {
      0%   { box-shadow: 0 0 0 0 rgba(61, 242, 255, 0.7); }
      100% { box-shadow: 0 0 0 12px rgba(61, 242, 255, 0); }
    }

    h1 {
      font-family: var(--display); letter-spacing: 0.02em;
      font-size: clamp(1.9rem, 6vw, 3.4rem); line-height: 1.1;
      margin-bottom: 0.7rem;
    }
    h1 .hello { display: block; font-size: 0.5em; color: var(--muted); font-weight: 500; margin-bottom: 0.2rem; }
    h1 span.name {
      display: inline-block;
      background: linear-gradient(100deg, #fff 20%, var(--cyan) 55%, var(--violet), var(--cyan));
      background-size: 200% auto;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: shimmer 5s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }

    h2 {
      font-family: var(--display); font-weight: 500;
      font-size: clamp(1.05rem, 2.6vw, 1.5rem);
      color: var(--text); min-height: 1.6em; margin-bottom: 1rem;
    }
    h2.typing::after {
      content: ''; display: inline-block; width: 2px; height: 1.1em; margin-left: 4px;
      background: var(--cyan); vertical-align: -0.15em; animation: blink 0.8s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .welcome-description { color: var(--muted); max-width: 52ch; margin: 0 auto 1.6rem; }

    .welcome-btn {
      display: inline-flex; align-items: center; gap: 0.7rem;
      position: relative; overflow: hidden; z-index: 0;
      padding: 0.9rem 2rem; text-decoration: none;
      font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: 0.02em;
      color: var(--cyan); border: 1px solid var(--cyan); border-radius: 4px;
      transition: color 0.35s, box-shadow 0.35s, transform 0.35s;
      animation: btn-glow 2.8s ease-in-out infinite;
    }
    .welcome-btn::before {
      content: ''; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(90deg, var(--cyan), var(--violet));
      transform: translateX(-101%); transition: transform 0.4s ease;
    }
    .welcome-btn .arrow { display: inline-block; transition: transform 0.35s; }
    .welcome-btn:hover, .welcome-btn:focus-visible {
      color: var(--void); transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(61, 242, 255, 0.55);
      animation: none; outline: none;
    }
    .welcome-btn:hover::before, .welcome-btn:focus-visible::before { transform: translateX(0); }
    .welcome-btn:hover .arrow, .welcome-btn:focus-visible .arrow { transform: translateX(6px); }
    @keyframes btn-glow {
      50% { box-shadow: 0 0 22px rgba(61, 242, 255, 0.35); }
    }

    .welcome-footer {
      margin-top: 2rem; font-size: 0.72rem; letter-spacing: 0.25em;
      color: var(--muted); opacity: 0.7;
    }

    /* ---------- Page exit transition ---------- */
    .wipe {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      background: linear-gradient(120deg, var(--cyan), var(--violet));
      transform: translateX(-101%);
    }
    body.leaving .wipe { animation: wipe 0.7s cubic-bezier(.7, 0, .3, 1) forwards; }
    body.leaving .welcome-content { animation: panel-out 0.6s ease forwards; }
    @keyframes wipe { to { transform: translateX(0); } }
    @keyframes panel-out { to { opacity: 0; transform: scale(1.05); filter: blur(6px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .welcome-content > *, .welcome-content, .emblem { opacity: 1 !important; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="scan"></div>
  <div class="wipe"></div>

  <main class="welcome-content">
    <div class="emblem" aria-hidden="true">AA</div>
    <p class="status">WELCOME TO MY PORTFOLIO</p>
    <h1><span class="hello">Hello, I am</span><span class="name">Arabella Almonia</span></h1>
    <h2 id="role" class="typing" aria-label="Cybersecurity Analyst and Ethical Hacker"></h2>
    <p class="welcome-description">Explore my technical expertise and recent projects.</p>
    <div><a class="welcome-btn" id="enter" href="portfolio.html">Explore My Portfolio <span class="arrow">→</span></a></div>
    <p class="welcome-footer">DRIVEN BY PASSION · BUILT TO EVOLVE</p>
  </main>

  <script>
    /* ---------- Typing role line ---------- */
    (function () {
      var el = document.getElementById('role');
      var roles = ['Cybersecurity Analyst', 'Ethical Hacker', 'Cybersecurity Analyst and Ethical Hacker'];
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) { el.textContent = roles[2]; el.classList.remove('typing'); return; }
      var r = 0, i = 0, deleting = false;
      function tick() {
        var word = roles[r];
        i += deleting ? -1 : 1;
        el.textContent = word.slice(0, i);
        var delay = deleting ? 35 : 75;
        if (!deleting && i === word.length) {
          if (r === roles.length - 1) return;      /* stop on the full title */
          deleting = true; delay = 1100;
        } else if (deleting && i === 0) {
          deleting = false; r++; delay = 300;
        }
        setTimeout(tick, delay);
      }
      setTimeout(tick, 1400);
    })();

    /* ---------- Particle network background ---------- */
    (function () {
      var c = document.getElementById('bg-canvas');
      var ctx = c.getContext('2d');
      var pts = [], w, h, mouse = { x: -999, y: -999 };
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      function resize() {
        w = c.width = innerWidth; h = c.height = innerHeight;
        var n = Math.min(90, Math.floor(w * h / 18000));
        pts = [];
        for (var k = 0; k < n; k++) pts.push({
          x: Math.random() * w, y: Math.random() * h,
          vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 1.6 + 0.6
        });
      }
      addEventListener('resize', resize);
      addEventListener('pointermove', function (e) { mouse.x = e.clientX; mouse.y = e.clientY; });
      resize();

      (function draw() {
        ctx.clearRect(0, 0, w, h);
        for (var a = 0; a < pts.length; a++) {
          var p = pts[a];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > w) p.vx *= -1;
          if (p.y < 0 || p.y > h) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, 6.283);
          ctx.fillStyle = 'rgba(61,242,255,0.😎';
          ctx.fill();
          for (var b = a + 1; b < pts.length; b++) {
            var q = pts[b], dx = p.x - q.x, dy = p.y - q.y, d = dx * dx + dy * dy;
            if (d < 14000) {
              ctx.strokeStyle = 'rgba(139,92,255,' + (1 - d / 14000) * 0.4 + ')';
              ctx.lineWidth = 1;
              ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
            }
          }
          var mx = p.x - mouse.x, my = p.y - mouse.y, md = mx * mx + my * my;
          if (md < 22000) {
            ctx.strokeStyle = 'rgba(61,242,255,' + (1 - md / 22000) * 0.6 + ')';
            ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke();
          }
        }
        requestAnimationFrame(draw);
      })();
    })();

    /* ---------- Animated exit, then go to the portfolio ---------- */
    document.getElementById('enter').addEventListener('click', function (e) {
      e.preventDefault();
      var url = this.href;
      document.body.classList.add('leaving');
      setTimeout(function () { window.location.href = url; }, 750);
    });
  </script>
</body>
</html>
